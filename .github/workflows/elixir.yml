# The checks the CI runs, written out. This repository is private: the shared
# ash-project workflow cannot go green here (its code-scanning upload requires
# GitHub Advanced Security), so the needed subset is declared directly.
#
# The tests run against a real Postgres 18 with the `uuid-ossp`, `citext` and
# (optionally) `ash_functions` extensions available. The suite's migrations
# install what they need; see config/test.exs for the connection env vars.

name: Elixir CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    services:
      # pg18: the repo's `min_pg_version/0` is 18 (Phase 0, temporal-resources
      # readiness) -- the migrations use PostgreSQL 18 features (native
      # uuidv7(), which pg17 and earlier lack), so the service must be at
      # least 18 too.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
          PGTZ: UTC
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"
      # The devenv Postgres this repo develops against listens on 5435; the
      # CI service container is on the default 5432.
      - run: mix deps.get
      - run: mix test
        env:
          PGPORT: "5432"
          PGTZ: UTC

  compile:
    name: MIX_ENV=test mix compile --warnings-as-errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"
      - run: mix deps.get
      - run: mix compile --force --warnings-as-errors

  format:
    name: mix format --check-formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"
      - run: mix deps.get
      - run: mix format --check-formatted

  credo:
    name: mix credo --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"
      - run: mix deps.get
      - run: mix credo --strict
